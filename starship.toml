add_newline = false
palette = "mercurial"

format = """
$username\
$directory\
$git_branch\
$git_status\
$character"""

# ── Palette "mercurial" (dark) dari opencode-settings/themes/mercurial.json ──
[palettes.mercurial]
primary            = "#8da4f5"
secondary          = "#a7b6f8"
accent             = "#8da4f5"
error              = "#fc92b4"
warning            = "#fc9b6f"
success            = "#77c599"
info               = "#77becf"
text               = "#dddde5"
text_muted         = "#9d9da8"
background         = "#171721"
background_panel   = "#10101a"
background_element = "#272735"
border             = "#b4b7c8"
border_active      = "#8da4f5"
diff_added         = "#77c599"
diff_removed       = "#fc92b4"
diff_context       = "#9d9da8"
diff_hunk_header   = "#9d9da8"
diff_context_bg    = "#1e1e2a"
diff_line_number   = "#c3c3cc"
syntax_comment     = "#8b949e"
syntax_keyword     = "#ff7b72"
syntax_function    = "#bc8cff"
syntax_variable    = "#d29922"
syntax_string      = "#39c5cf"
syntax_number      = "#58a6ff"
syntax_type        = "#d29922"
syntax_operator    = "#ff7b72"
syntax_punctuation = "#c9d1d9"

[character]
success_symbol = '[\$](bold success)'
error_symbol   = '[\$](bold error)'

[directory]
truncation_length = 1
truncate_to_repo   = true
read_only          = " 🔒"
style              = "bold primary"
read_only_style    = "error"

[git_branch]
format = '[\[](text_muted)[$branch](info)'
style  = "bold secondary"

[git_status]
format = '[$all_status$ahead_behind](warning)[\]](text_muted) '
style  = "text_muted"
conflicted  = " *"
stashed     = " *"
deleted     = " *"
renamed     = " *"
modified    = " *"
typechanged = " *"
staged      = " *"
untracked   = " *"
ahead       = " *"
behind      = " *"
diverged    = " *"
up_to_date  = ""

[username]
show_always = false
format      = "[$user]($style)@"
style_user  = "text_muted"
style_root  = "error"
