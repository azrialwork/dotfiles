add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$character"""

[character]
success_symbol = '[\$](bold green)'
error_symbol  = '[\$](bold red)'

[directory]
truncation_length = 1
truncate_to_repo   = true
read_only          = " 🔒"

[git_branch]
format = "[$branch]($style) "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'

[username]
show_always = false
format      = "[$user]($style)@"
